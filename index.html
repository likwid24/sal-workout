<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;font-family:Georgia,serif;color:#e8e8f0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:72px}
.hdr{background:linear-gradient(160deg,#12121a,#0d0d1a);border-bottom:1px solid #252535;padding:13px 16px 9px;position:sticky;top:0;z-index:100}
.hdr-sub{font-size:8.5px;letter-spacing:4px;color:#8b6914;text-transform:uppercase}
.hdr-title{font-size:16px;font-weight:bold;color:#c8a951}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#12121a;border-top:1px solid #252535;display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:9px 4px 7px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;font-family:Georgia,serif;color:#4a4a62;transition:color .2s}
.nb.active{color:#c8a951}
.nb-icon{font-size:16px}
.pg{padding:13px 13px 0}
.card{background:#12121a;border:1px solid #252535;border-radius:11px;padding:11px 13px;margin-bottom:9px}
.acard{background:#12121a;border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;border-left-width:3px;border-left-style:solid;border-top:1px solid transparent;border-right:1px solid transparent;border-bottom:1px solid transparent}
.lbl{font-size:8.5px;letter-spacing:3px;text-transform:uppercase;margin-bottom:7px;color:#4a4a62}
.pill{display:inline-block;border-radius:20px;padding:2px 8px;font-size:8.5px;margin-right:3px;border:1px solid transparent}
.btn{border-radius:7px;padding:8px 16px;cursor:pointer;font-size:12px;font-family:Georgia,serif;border:1px solid transparent}
.btn-sm{border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:Georgia,serif;border:1px solid transparent}
.inp{background:#1a1a26;border:1px solid #252535;border-radius:6px;color:#e8e8f0;padding:5px 6px;font-size:13px;font-family:Georgia,serif;width:58px;text-align:center}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.set-row{display:flex;align-items:center;gap:6px;background:#1a1a26;border-radius:7px;padding:5px 9px;border:1px solid #252535;margin-bottom:4px;transition:background .2s,border-color .2s}
.set-row.done{background:rgba(46,204,113,.05);border-color:rgba(46,204,113,.3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#12121a;border:1px solid #252535;border-radius:14px 14px 0 0;padding:18px 16px 32px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#000;padding:6px 16px;border-radius:18px;font-size:11px;font-weight:bold;z-index:999;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
#install-banner{display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);width:calc(100% - 26px);max-width:454px;background:#1a1a26;border:1px solid #c8a95144;border-radius:11px;padding:10px 14px;z-index:300;align-items:center;gap:10px}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>

</div>
<div id="modal-container"></div>

<script>
(function(){
  const canvas=document.createElement('canvas');
  canvas.width=512;canvas.height=512;
  const ctx=canvas.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,512,512);
  grad.addColorStop(0,'#1a1a26');grad.addColorStop(1,'#0a0a0f');
  ctx.fillStyle=grad;

  ctx.beginPath();ctx.roundRect(8,8,496,496,76);ctx.stroke();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('S',256,256);
  ctx.strokeStyle='#8b691466';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(80,380);ctx.lineTo(432,380);ctx.stroke();
  const iconUrl=canvas.toDataURL('image/png');
  document.getElementById('apple-icon').href=iconUrl;
  const manifest={name:'Sal DePaola · Workout 2026',short_name:'Sal Workout',description:'Personalized spine-safe workout protocol',start_url:'.',display:'standalone',background_color:'#0a0a0f',theme_color:'#0a0a0f',orientation:'portrait-primary',icons:[{src:iconUrl,sizes:'512x512',type:'image/png',purpose:'any maskable'},{src:iconUrl,sizes:'192x192',type:'image/png'}]};
  const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});

  if('serviceWorker' in navigator){
    const swCode=`const CACHE='sal-workout-v2';const ASSETS=[self.location.pathname];self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const clone=res.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));return res;}).catch(()=>caches.match('/'))));});`;
    try{const swBlob=new Blob([swCode],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:'./'}).catch(()=>{});}catch(e){}
  }
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  if(!isStandalone&&!localStorage.getItem('banner_dismissed')){
    setTimeout(()=>{document.getElementById('install-banner').style.display='flex';},2000);
    document.getElementById('install-banner').querySelector('button').addEventListener('click',()=>localStorage.setItem('banner_dismissed','1'));
  }
})();
const C={accent:'#c8a951',accentDim:'#8b6914',blue:'#4a9eff',green:'#2ecc71',red:'#e74c3c',orange:'#f39c12',purple:'#9b59b6',cyan:'#1abc9c',dim:'#4a4a62',med:'#9090a8',text:'#e8e8f0'};
const SCHEDULE=[{day:'Monday',focus:'Chest + Biceps',alt:'Chest + Biceps B',icon:'💪',color:C.blue,tag:'PUSH PULL'},{day:'Tuesday',focus:'HIIT / MMA',alt:'HIIT B',icon:'🥊',color:C.red,tag:'CARDIO'},{day:'Wednesday',focus:'Back + Triceps',alt:'Back + Triceps B',icon:'🔙',color:C.green,tag:'PULL PUSH'},{day:'Thursday',focus:'Shoulders + Light Legs',alt:'Shoulders B',icon:'🔝',color:C.accent,tag:'STRENGTH'},{day:'Friday',focus:'HIIT / MMA',alt:'HIIT B',icon:'🥊',color:C.red,tag:'CARDIO'},{day:'Saturday',focus:'Back + Triceps',alt:'Back + Triceps B',icon:'🔙',color:C.green,tag:'PULL PUSH'},{day:'Sunday',focus:'MMA / Rest',icon:'🥋',color:C.purple,tag:'OPTIONAL'}];
const LIGHT_LEGS={title:'Light Leg Finisher (10-15 min)',color:C.orange,note:'Moderate weight only — spine already fatigued. Pump work, not max effort.',exercises:[{name:'Leg Press',sets:3,reps:'12-15',note:'Moderate weight. Full range.'},{name:'Leg Extension',sets:2,reps:'15-20',note:'Light and pump-focused. Squeeze at top.'},{name:'Lying Leg Curl',sets:2,reps:'12-15',note:'Prone deloads lumbar. Controlled.'},{name:'Leg Press Calf Raise',sets:3,reps:'20-25',note:'3-4 sec eccentric. Vary toe angle.'}]};
const WORKOUTS={'Chest + Biceps':{color:C.blue,icon:'💪',lightLegs:true,split:'Chest first. Bis are fully rested as the antagonist — hit them hard after pressing.',warmup:['McGill Curl-Up 3x10 (hold 8-10 sec)','Side Plank 3x25 sec each side','Bird Dog 3x10/side (hold 8-10 sec)','Chin Tucks 3x10'],exercises:[{name:'Incline DB Press',sets:4,reps:'8-10',muscle:'Upper Chest',description:'Set bench to 45-60 degrees. Elbows at 45 degrees from torso. Full stretch at bottom, press up and slightly together. Priority movement for upper chest — leads every chest session.',video:'incline dumbbell press form'},{name:'Flat Machine Chest Press',sets:3,reps:'10-12',muscle:'Chest',description:'Do NOT arch lower back off the pad. Full range of motion. Squeeze chest at peak extension. Slow 3-second eccentric on the return.',video:'machine chest press form'},{name:'Low-to-High Cable Fly',sets:3,reps:'12-15',muscle:'Upper Chest',description:'Cable at lowest setting. Fly upward and across toward opposite shoulder. Best isolation for the clavicular head. Squeeze hard at top.',video:'low to high cable fly upper chest'},{name:'Incline DB Fly',sets:3,reps:'10-12',muscle:'Upper Chest',description:'Bench at 45 degrees. Full stretch at bottom, feel the pec. Controlled 3-second eccentric. Squeeze at top.',video:'incline dumbbell fly form'},{name:'Face Pulls',sets:3,reps:'15-20',muscle:'Rear Delt / Cervical',description:'MANDATORY every upper body session. Cable at forehead height. Elbows high and wide. Pull to forehead. Rear delt + external rotation + cervical correction.',video:'face pull cable form'},{name:'DB Curl',sets:4,reps:'10-12',muscle:'Biceps',description:'Bis are FRESH after pressing. Push them hard. Alternating. Supinate fully at top. Slow 2-3 sec eccentric. No swinging.',video:'dumbbell curl proper form'},{name:'Incline DB Curl',sets:3,reps:'10-12',muscle:'Biceps Long Head',description:'Bench at 45-60 degrees, arms hang below torso. Full long head stretch at bottom. Supinate and curl. Best peak builder. Control the negative.',video:'incline dumbbell curl long head'},{name:'Hammer Curl',sets:3,reps:'10-12',muscle:'Brachialis',description:'Neutral grip throughout. Builds arm thickness and pushes the bicep peak up. Controlled throughout.',video:'hammer curl form'}]},'Back + Triceps':{color:C.green,icon:'🔙',lightLegs:false,split:'Back first. Tris are fully rested as the antagonist during all that pulling — hit them properly after.',warmup:['McGill Curl-Up 3x10 (hold 8-10 sec)','Side Plank 3x25 sec each side','Bird Dog 3x10/side (hold 8-10 sec)','Chin Tucks 3x10'],exercises:[{name:'Lat Pulldown',sets:4,reps:'10-12',muscle:'Lats',description:'Wide overhand grip. Pull to upper chest with slight lean back. Traction effect — decompressive for your spine. Do NOT hyperextend at the bottom.',video:'lat pulldown proper form'},{name:'Seated Cable Row',sets:4,reps:'10-12',muscle:'Mid Back',description:'Torso UPRIGHT throughout. Do NOT hyperextend at the top. Pull to lower chest. Squeeze scapulae hard. Slow 3-second eccentric.',video:'seated cable row proper form'},{name:'Chest-Supported Machine Row',sets:3,reps:'10-12',muscle:'Mid Back',description:'Chest pad supported — removes all lumbar loading. Full range of motion. Best option when lumbar feels fatigued.',video:'chest supported machine row'},{name:'Straight-Arm Pulldown',sets:3,reps:'12-15',muscle:'Lats',description:'Cable high, arms straight with slight elbow bend. Pull down in arc to hips. Isolates lats without spinal loading.',video:'straight arm pulldown cable'},{name:'Face Pulls',sets:3,reps:'15-20',muscle:'Rear Delt / Cervical',description:'MANDATORY every upper body session. Cable at forehead height. Elbows high and wide. Non-negotiable for cervical lordosis loss.',video:'face pull cable form'},{name:'Cable Tricep Pushdown',sets:4,reps:'12-15',muscle:'Triceps',description:'Tris are FRESH here. Work them hard. Rope or bar. Elbows pinned to sides. Full extension at bottom. Slow 2-sec eccentric.',video:'cable tricep pushdown rope'},{name:'Overhead DB Tricep Extension',sets:3,reps:'10-12',muscle:'Triceps Long Head',description:'Seated for back support. Single DB overhead with both hands. Lower slowly behind head — full long head stretch.',video:'seated overhead tricep extension'},{name:'Tricep Dip (Machine)',sets:3,reps:'10-12',muscle:'Triceps',description:'Machine version only. Full extension at top. Controlled return. Good finisher after pushdowns and overhead work.',video:'machine tricep dip form'}]},'Shoulders + Light Legs':{color:C.accent,icon:'🔝',lightLegs:true,split:'Shoulders at full intensity first. Light leg finisher after.',warmup:['McGill Curl-Up 3x10 (hold 8-10 sec)','Side Plank 3x25 sec each side','Bird Dog 3x10/side (hold 8-10 sec)','Chin Tucks 3x10'],exercises:[{name:'Seated DB Shoulder Press',sets:4,reps:'8-10',muscle:'All Deltoids',description:'Bench at 90 degrees. Vertical back support NON-NEGOTIABLE. Controls lumbar extension compensation. Lead with this while fresh.',video:'seated dumbbell shoulder press form'},{name:'Cable Lateral Raise',sets:4,reps:'12-15',muscle:'Medial Delt',description:'Cable keeps constant tension through full range. Superior to DB laterals. Single arm, cable at ankle level. Raise to shoulder height. Pause 1 sec at top.',video:'cable lateral raise form'},{name:'Face Pulls',sets:4,reps:'15-20',muscle:'Rear Delt / Cervical',description:'MANDATORY. Most important for your posture profile. Cable at forehead height. Elbows high and wide. Pull to forehead.',video:'face pull cable form'},{name:'Seated DB Lateral Raise',sets:3,reps:'15-20',muscle:'Medial Delt',description:'Sit on bench edge. Slight forward lean from HIP not spine. 3-second eccentric. 1-2 sec pause at top.',video:'seated dumbbell lateral raise'},{name:'Rear Delt Cable Fly',sets:3,reps:'15',muscle:'Rear Delt',description:'Cable low. Pull across body and upward. Or rear delt machine. Addresses trap overdevelopment relative to upper chest.',video:'rear delt cable fly form'},{name:'DB Upright Row',sets:3,reps:'12',muscle:'Medial Delt / Upper Trap',description:'Dumbbells preferred. Pull elbows HIGH and OUT, not straight up. Stop at upper chest. Wide grip only.',video:'dumbbell upright row form'}]},'HIIT / MMA':{color:C.red,icon:'🥊',lightLegs:false,split:'2-3 sessions per week. Bike intervals are the gold standard for your spine.',warmup:['McGill Curl-Up 2x10','Bird Dog 2x8/side','Hip Circles 2x10 each direction','Light shadow boxing 2 min'],exercises:[{name:'Stationary Bike Intervals',sets:1,reps:'20-30 min',muscle:'Cardio / Legs',description:'BEST cardio for your spine. Seated flexion-based position OPENS the stenotic canal. Protocol: 30 sec all-out sprint, 90 sec recovery, repeat 10-15 rounds. OR 30 min steady state at 75%. Zero axial spinal loading.',video:'stationary bike HIIT intervals'},{name:'Shadow Boxing',sets:5,reps:'3 min / 1 min rest',muscle:'Full Body / Cardio',description:'Full body conditioning. Jab-cross-hook-uppercut combinations. Move your feet. Rotate from hips but keep lumbar controlled.',video:'shadow boxing workout rounds'},{name:'Heavy Bag Work',sets:4,reps:'3 min / 1 min rest',muscle:'Power / Cardio',description:'Punches and kicks. Rotate from hips with core braced. Control explosive trunk rotation under fatigue.',video:'heavy bag boxing workout'},{name:'Battle Ropes',sets:5,reps:'30 sec on / 30 sec off',muscle:'Upper Body / Cardio',description:'Alternating or simultaneous waves. Slight forward hip hinge, not spinal flexion. Core braced.',video:'battle ropes workout technique'},{name:'Sled Push',sets:6,reps:'20-30 meters',muscle:'Full Body',description:'Forward lean is hip hinge not spinal flexion. Drive from the legs. Keep back flat. Substitute with bike sprints if no sled.',video:'sled push proper form'},{name:'Jump Rope',sets:1,reps:'10-15 min mixed',muscle:'Cardio / Footwork',description:'Two-foot jump with soft knees. Stop if lumbar pain. Alternate 1 min fast / 1 min slow.',video:'jump rope workout technique'},{name:'Pad Work / Mitts',sets:4,reps:'3 min rounds',muscle:'Speed / Skill',description:'With a partner. Combination work. Control lumbar on explosive rotational shots.',video:'boxing mitt work combinations'}]},'MMA / Rest':{color:C.purple,icon:'🥋',lightLegs:false,split:'Optional day. Light technical MMA or full rest depending on recovery.',warmup:['Light stretching 5 min','McGill Curl-Up 2x10','Bird Dog 2x8/side'],exercises:[{name:'Grappling / Clinch Work',sets:1,reps:'As needed',muscle:'Full Body',description:'CAUTION with anterolisthesis. Avoid takedowns where you absorb impact at the lumbar. Clinch work and upper body grappling are lower risk.',video:'wrestling clinch work technique'},{name:'Light Technical Sparring',sets:1,reps:'3-5 rounds',muscle:'Skill / Cardio',description:'50% intensity. Skill work and timing, not war. Stop at any lumbar discomfort.',video:'light sparring boxing technique'},{name:'Hip Flexor Stretch',sets:3,reps:'45 sec each side',muscle:'Hip Flexors',description:'CRITICAL. Tight hip flexors increase anterior shear at L4-L5. Kneeling lunge, posterior pelvic tilt. Breathe into it.',video:'kneeling hip flexor stretch lower back'},{name:'Cat-Cow Mobility',sets:3,reps:'10 slow',muscle:'Lumbar Mobility',description:'On hands and knees. Arch and round slowly. Gentle lumbar mobility. Therapeutic for L4-L5.',video:'cat cow stretch spine'}]},'Home - Chest + Biceps':{color:C.blue,icon:'🏠',lightLegs:true,split:'Home version. Bench to incline for upper chest priority. Bis are fresh after pressing.',warmup:['McGill Curl-Up 3x10','Side Plank 3x25 sec','Bird Dog 3x10/side','Chin Tucks 3x10'],exercises:[{name:'Incline DB Press (45-60 deg)',sets:4,reps:'8-10',muscle:'Upper Chest',description:'Priority movement. Full stretch at bottom, press up and slightly together. Do NOT arch lower back off bench.',video:'incline dumbbell press form'},{name:'Flat DB Press',sets:3,reps:'10-12',muscle:'Chest',description:'Full range. Slow 3-second eccentric. Squeeze chest at top.',video:'flat dumbbell press form'},{name:'Incline DB Fly',sets:3,reps:'12',muscle:'Upper Chest',description:'Bench at 45 degrees. Full stretch. Controlled arc. Feel the pec. Squeeze at top.',video:'incline dumbbell fly form'},{name:'DB Floor Press',sets:3,reps:'12-15',muscle:'Chest / Triceps',description:'Lie on floor. Floor stops arms at 90 degrees — no lower back arch. Good when lumbar is sensitive.',video:'dumbbell floor press form'},{name:'Bent-Over Rear Delt Fly',sets:3,reps:'15',muscle:'Rear Delt',description:'Chest on thighs — spine fully supported. Arms fly out to sides. Face pull substitute at home. Mandatory.',video:'seated bent over rear delt fly'},{name:'DB Curl',sets:4,reps:'10-12',muscle:'Biceps',description:'Bis are fresh. Work them. Alternating. Full supination at top. Slow eccentric. No swinging.',video:'dumbbell curl proper form'},{name:'Incline DB Curl',sets:3,reps:'10-12',muscle:'Biceps Long Head',description:'Bench at 45-60 degrees, arms hang below torso. Best peak builder at home.',video:'incline dumbbell curl long head'},{name:'Hammer Curl',sets:3,reps:'10-12',muscle:'Brachialis',description:'Neutral grip. Builds thickness. Alternating. Controlled.',video:'hammer curl form'}]},'Home - Back + Triceps':{color:C.green,icon:'🏠',lightLegs:false,split:'Home version. Back movements modified. Tris hit hard after pulling.',warmup:['McGill Curl-Up 3x10','Side Plank 3x25 sec','Bird Dog 3x10/side','Chin Tucks 3x10'],exercises:[{name:'Single-Arm DB Row',sets:4,reps:'10-12 each',muscle:'Lats / Mid Back',description:'Knee and same-side hand on bench — back FULLY supported. Pull DB to hip. Full stretch at bottom, squeeze scapula at top.',video:'single arm dumbbell row form'},{name:'DB Pullover (on bench)',sets:3,reps:'12-15',muscle:'Lats / Serratus',description:'Perpendicular on bench, shoulders supported. Hold DB overhead with both hands. Lower behind head in arc — full lat stretch.',video:'dumbbell pullover lat form'},{name:'Bent-Over Rear Delt Fly',sets:3,reps:'15',muscle:'Rear Delt',description:'Chest on thighs — spine fully supported. Arms fly out to sides. Face pull substitute. Do not skip.',video:'seated bent over rear delt fly'},{name:'Overhead DB Tricep Extension',sets:4,reps:'10-12',muscle:'Triceps Long Head',description:'Seated for back support. Single DB overhead with both hands. Lower slowly behind head. Tris are fresh after pulling.',video:'seated overhead tricep extension'},{name:'Close-Grip DB Press',sets:3,reps:'10-12',muscle:'Triceps',description:'Flat bench. DBs close together. Press with elbows tucked. Primarily tricep drive.',video:'close grip dumbbell press triceps'},{name:'DB Skull Crusher',sets:3,reps:'10-12',muscle:'Triceps',description:'Lie on bench. DBs over chest. Lower toward temples by bending elbows only. Press back up.',video:'dumbbell skull crusher form'}]},'Home - Shoulders':{color:C.accent,icon:'🏠',lightLegs:true,split:'Full shoulder session at home. All spine-safe. Back support mandatory on pressing.',warmup:['McGill Curl-Up 3x10','Side Plank 3x25 sec','Bird Dog 3x10/side','Chin Tucks 3x10'],exercises:[{name:'Seated DB Press (bench 90 deg)',sets:4,reps:'8-10',muscle:'All Deltoids',description:'Bench fully upright. Back flat against pad. Lumbar extension compensation eliminated by back support.',video:'seated dumbbell shoulder press 90 degree'},{name:'Seated DB Lateral Raise',sets:4,reps:'12-15',muscle:'Medial Delt',description:'Sit on bench edge. Slight forward lean from HIP not spine. 3-second eccentric. 1-2 sec pause at top.',video:'seated dumbbell lateral raise'},{name:'Bent-Over Rear Delt Fly',sets:4,reps:'15',muscle:'Rear Delt',description:'Chest on thighs — spine fully supported. Fly out to sides. Non-negotiable for posture.',video:'seated bent over rear delt fly'},{name:'DB Arnold Press (Seated)',sets:3,reps:'10-12',muscle:'All Deltoids',description:'Same 90-degree back support. Start palms facing you, rotate out as you press. Hits all three delt heads.',vide const NEVER=['Conventional Deadlift','Romanian Deadlift','Barbell Squat','Good Mornings','Back Extensions','Standing Heavy Press','Standing Calf Raises','Seated Calf Raises','Heavy Bent-Over Row'];
const TIPS=['McGill Big 3 before EVERY session — 8 min that protect the 10mm anterolisthesis','Back + Tris: tris rest while back pulls. They are fresh and ready to work hard after.','Chest + Bis: bis rest while chest presses. Hit them with full intensity after.','Lumbar extension compresses the stenotic canal. Bike for HIIT — opens the canal.','BPC-157 500mcg daily SubQ near lumbar. TB-500 2.5mg 2x/week. Run them together.','Light leg finisher = moderate weight only. Spine is already loaded from the main lift.','Face pulls are corrective therapy for 79.3% cervical lordosis loss. Every upper session.','Tight hip flexors increase anterior shear at L4-L5. Stretch them every rest day.','Getting to 11% BF is directly therapeutic — every lb off is less load on L4-L5.','Tesamorelin IGF-1 elevation is anabolic for ligaments and disc matrix — spine win.'];
let STATE={tab:'home',activeWorkout:null,tipIndex:0,history:{}};
try{const s=localStorage.getItem('salwk4');if(s)STATE.history=JSON.parse(s);}catch(e){}
function saveHistory(){try{localStorage.setItem('salwk4',JSON.stringify(STATE.history));}catch(e){}}
function getBest(wk,ex){const h=STATE.history[wk+'|'+ex]||[];return h.length?Math.max(...h.map(x=>+x.w||0)):null;}
function getLast(wk,ex){const h=STATE.history[wk+'|'+ex]||[];return h.length?h[h.length-1]:null;}
function getToday(){return new Date().toLocaleDateString('en-US',{weekday:'long'});}
let toastTimer=null;
function flash(msg){const t=document.getElementById('toast');t.textContent='✓ '+msg;t.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity='0',2000);}
function pill(text,color){return`<span class="pill" style="background:${color}18;color:${color};border-color:${color}44">${text}</span>`;}
function goTab(tab){STATE.tab=tab;if(tab!=='workout')STATE.activeWorkout=null;['home','schedule','workout','progress'].forEach(t=>{document.getElementById('nb-'+t).className='nb'+(t===tab?' active':'');});const titles={home:'Dashboard',schedule:'Schedule',workout:STATE.activeWorkout||'Workouts',progress:'Progress'};document.getElementById('hdr-title').textContent=titles[tab];render();}
function goWorkout(name){STATE.activeWorkout=name;STATE.tab='workout';document.getElementById('nb-workout').className='nb active';['home','schedule','progress'].forEach(t=>document.getElementById('nb-'+t).className='nb');document.getElementById('hdr-title').textContent=name;render();}
function render(){const main=document.getElementById('main');if(STATE.tab==='home')main.innerHTML=renderHome();else if(STATE.tab==='schedule')main.innerHTML=renderSchedule();else if(STATE.tab==='workout')main.innerHTML=STATE.activeWorkout?renderWorkout():renderWorkoutList();else if(STATE.tab==='progress')main.innerHTML=renderProgress();attachSetListeners();}
function renderHome(){const today=getToday();const ts=SCHEDULE.find(s=>s.day===today)||SCHEDULE[0];const tip=TIPS[STATE.tipIndex];const hasWorkout=!!WORKOUTS[ts.focus];return`<div class="pg"><div class="card" style="border-color:${ts.color}55;background:linear-gradient(135deg,#12121a,#0e0e1c)"><div class="lbl">${today.toUpperCase()} · TODAY</div><div style="font-size:28px;margin-bottom:5px">${ts.icon}</div><div style="font-size:18px;font-weight:bold;color:${ts.color};margin-bottom:7px">${ts.focus}</div>${hasWorkout?`<button class="btn" style="background:${ts.color}18;color:${ts.color};border-color:${ts.color}55" onclick="goWorkout('${ts.focus}')">Start Workout →</button>`:''}</div><div class="card" style="border-color:${C.accent}33;background:${C.accent}07"><div class="lbl" style="color:${C.accentDim}">Spine Protocol Tip</div><div id="tip-text" style="font-size:12px;color:${C.text};line-height:1.7;font-style:italic">${tip}</div></div><div class="card"><div class="lbl" style="color:${C.green}">Daily Non-Negotiables</div>${['McGill Curl-Up 3x10 (8-10 sec hold)','Side Plank 3x30 sec each side','Bird Dog 3x10/side (8-10 sec hold)','Chin Tucks 3x10 — every day','Hip Flexor Stretch on rest days'].map((item,i,a)=>`<div style="display:flex;align-items:center;gap:9px;padding:5px 0;${i<a.length-1?'border-bottom:1px solid #252535':''}"><div style="width:16px;height:16px;border-radius:50%;background:${C.green}18;border:1px solid ${C.green}55;display:flex;align-items:center;justify-content:center;font-size:8px;color:${C.green};flex-shrink:0">✓</div><div style="font-size:11px;color:${C.med}">${item}</div></div>`).join('')}</div><div class="card" style="border-color:${C.red}33"><div class="lbl" style="color:${C.red}">Never Do — Spine Contraindicated</div><div style="display:flex;flex-wrap:wrap;gap:4px">${NEVER.map(ex=>pill(ex,C.red)).join('')}</div></div><div class="card"><div class="lbl">Active Spine Peptides</div>${[['BPC-157','500mcg daily SubQ near lumbar',C.green],['TB-500','2.5mg 2x/week SubQ',C.green],['GHK-Cu','2mg 3x/week SubQ',C.blue],['Tesamorelin','1mg nightly fasted',C.accent]].map(([n,d,c],i,a)=>`<div style="display:flex;justify-content:space-between;padding:5px 0;${i<a.length-1?'border-bottom:1px solid #252535':''}"><div style="font-size:12px;font-weight:bold;color:${c}">${n}</div><div style="font-size:10px;color:${C.med}">${d}</div></div>`).join('')}</div></div>`;}
function renderSchedule(){const today=getToday();return`<div class="pg"><div class="lbl">Weekly Split</div>${SCHEDULE.map(d=>`<div class="acard" style="border-left-color:${d.color};${d.day===today?'background:'+d.color+'0e':''}" ${WORKOUTS[d.focus]?`onclick="goWorkout('${d.focus}')"`:''}><div style="display:flex;align-items:center;gap:11px"><div style="font-size:22px;width:34px;text-align:center">${d.icon}</div><div style="flex:1"><div style="font-size:9px;color:${C.dim};letter-spacing:1px">${d.day.toUpperCase()}${d.day===today?' · TODAY':''} · ${d.tag}</div><div style="font-size:13px;font-weight:bold;color:${d.color}">${d.focus}</div>${d.alt?`<div style="font-size:9px;color:${C.dim};margin-top:2px;letter-spacing:.5px">Week A: ${d.focus} · Week B: ${d.alt}</div>`:''}</div>${WORKOUTS[d.focus]?`<div style="color:${C.dim}">›</div>`:''}</div></div>`).join('')}<div class="card" style="margin-top:4px"><div class="lbl">Alternate Workouts (Week B)</div>${['Chest + Biceps B','Back + Triceps B','Shoulders B','HIIT B'].map(w=>`<div class="acard" style="border-left-color:${WORKOUTS[w].color};margin-bottom:5px" onclick="goWorkout('${w}')"><div style="display:flex;align-items:center;gap:9px"><span style="font-size:18px">${WORKOUTS[w].icon}</span><span style="font-size:12px;color:${WORKOUTS[w].color};font-weight:bold">${w}</span><span style="margin-left:auto;color:${C.dim}">›</span></div></div>`).join('')}</div><div class="card" style="margin-top:4px"><div class="lbl">Home Alternatives</div>${['Home - Chest + Biceps','Home - Back + Triceps','Home - Shoulders','McGill Core / Active Rest'].map(w=>`<div class="acard" style="border-left-color:${WORKOUTS[w].color};margin-bottom:5px" onclick="goWorkout('${w}')"><div style="display:flex;align-items:center;gap:9px"><span style="font-size:18px">${WORKOUTS[w].icon}</span><span style="font-size:12px;color:${WORKOUTS[w].color};font-weight:bold">${w}</span><span style="margin-left:auto;color:${C.dim}">›</span></div></div>`).join('')}</div></div>`;}
function renderWorkoutList(){return`<div class="pg"><div class="lbl">All Programs</div>${Object.entries(WORKOUTS).map(([name,data])=>`<div class="acard" style="border-left-color:${data.color}" onclick="goWorkout('${name}')"><div style="display:flex;align-items:center;gap:11px"><div style="font-size:24px;width:36px;text-align:center">${data.icon}</div><div style="flex:1"><div style="font-size:13px;font-weight:bold;color:${data.color}">${name}</div><div style="font-size:10px;color:${C.med}">${data.exercises.length} exercises${data.lightLegs?' + light legs':''}</div></div><div style="color:${C.dim};font-size:16px">›</div></div></div>`).join('')}</div>`;}
function renderSetRow(wk,exName,idx,col){const last=getLast(wk,exName);return`<div class="set-row" data-wk="${wk}" data-ex="${exName}" data-idx="${idx}" data-col="${col}"><div style="font-size:8.5px;color:${C.dim};width:24px;flex-shrink:0">S${idx+1}</div><input class="inp" type="number" placeholder="lbs" value="${last?last.w:''}" inputmode="decimal"/><span style="font-size:9px;color:${C.dim}">x</span><input class="inp" type="number" placeholder="reps" value="${last?last.r:''}" inputmode="numeric"/><button class="btn-sm log-btn" style="background:${col}18;color:${col};border-color:${col}55;margin-left:auto;flex-shrink:0">Log</button></div>`;}
function renderExBlock(ex,wkName,col,isLight){const best=getBest(wkName,ex.name);const last=getLast(wkName,ex.name);const safeEx=JSON.stringify({...ex,wk:wkName,col}).replace(/&/g,'&amp;').replace(/"/g,'&quot;');const infoBtn=!isLight?`<button class="btn-sm" style="background:${col}18;color:${col};border-color:${col}55;flex-shrink:0;margin-left:7px" data-ex="${safeEx}" onclick="showModal(this.dataset.ex)">ℹ</button>`:'';return`<div class="card"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px"><div style="flex:1"><div style="font-size:13px;font-weight:bold;color:${C.text};margin-bottom:3px">${ex.name}</div><div>${pill(ex.sets+' x '+ex.reps,col)}${pill(ex.muscle,C.dim)}</div></div>${infoBtn}</div>${isLight&&ex.note?`<div style="font-size:10px;color:${C.dim};font-style:italic;margin-bottom:7px">${ex.note}</div>`:''}<div style="font-size:10px;color:${C.dim};margin-bottom:7px">${best?`Last: ${last.w}lbs x ${last.r} · Best: ${best}lbs`:''}</div>${Array.from({length:ex.sets},(_,si)=>renderSetRow(wkName,ex.name,si,col)).join('')}</div>`;}
function renderWorkout(){const name=STATE.activeWorkout;const data=WORKOUTS[name];if(!data)return renderWorkoutList();return`<div style="background:linear-gradient(135deg,${data.color}18,#12121a);padding:13px 14px 9px;border-bottom:1px solid ${data.color}33"><button onclick="STATE.activeWorkout=null;goTab('workout')" style="background:none;border:none;color:${C.med};cursor:pointer;font-size:11px;padding:0;margin-bottom:7px;font-family:Georgia,serif">← All Workouts</button><div style="font-size:24px;margin-bottom:3px">${data.icon}</div><div style="font-size:17px;font-weight:bold;color:${data.color}">${name}</div><div style="font-size:11px;color:${C.med};font-style:italic;margin-top:2px">${data.split}</div></div><div style="padding:11px 13px 0">${data.warmup.length?`<div class="card" style="border-color:${C.green}44;background:${C.green}07"><div class="lbl" style="color:${C.green}">Warmup — Do This First</div>${data.warmup.map((w,i,a)=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;${i<a.length-1?'border-bottom:1px solid #252535':''}"><div style="width:15px;height:15px;border-radius:50%;background:${C.green}18;border:1px solid ${C.green}55;display:flex;align-items:center;justify-content:center;font-size:7.5px;color:${C.green};flex-shrink:0">${i+1}</div><div style="font-size:11px;color:${C.med}">${w}</div></div>`).join('')}</div>`:''} ${data.exercises.map(ex=>renderExBlock(ex,name,data.color,false)).join('')}${data.lightLegs?`<div class="card" style="border-color:${LIGHT_LEGS.color}44;background:${LIGHT_LEGS.color}07"><div class="lbl" style="color:${LIGHT_LEGS.color}">⚡ ${LIGHT_LEGS.title}</div><div style="font-size:10px;color:${C.med};font-style:italic;margin-bottom:10px">${LIGHT_LEGS.note}</div>${LIGHT_LEGS.exercises.map(ex=>renderExBlock(ex,name+'|legs',LIGHT_LEGS.color,true)).join('')}</div>`:''}</div>`;}
function renderProgress(){const keys=Object.keys(STATE.history);const total=Object.values(STATE.history).reduce((a,h)=>a+h.length,0);return`<div class="pg"><div class="lbl">Training Progress</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px">${[['Total Sets',total,C.accent],['Exercises',keys.length,C.blue]].map(([l,v,c])=>`<div class="card" style="border-color:${c}33;text-align:center"><div style="font-size:28px;font-weight:bold;color:${c}">${v}</div><div style="font-size:8.5px;color:${C.med};letter-spacing:1px">${l.toUpperCase()}</div></div>`).join('')}</div>${!keys.length?`<div class="card" style="text-align:center;padding:28px"><div style="font-size:30px;margin-bottom:7px">📊</div><div style="color:${C.med};font-size:12px">No workouts logged yet.</div><div style="color:${C.dim};font-size:11px;margin-top:4px">Start a workout and log your sets.</div></div>`:keys.map(key=>{const parts=key.split('|');const wk=parts[0];const ex=parts[1];const h=STATE.history[key];const best=Math.max(...h.map(x=>+x.w||0));const last=h[h.length-1];const trend=h.length>1?(+last.w-+h[h.length-2].w):0;return`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><div><div style="font-size:12px;font-weight:bold;color:${C.text}">${ex}</div><div style="font-size:9.5px;color:${C.dim}">${wk}</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:bold;color:${C.accent}">${best}lbs</div><div style="font-size:8.5px;color:${C.accentDim}">BEST</div></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:${C.med}"><span>Last: ${last.w}lbs x ${last.r} · ${last.date}</span>${trend!==0?`<span style="color:${trend>0?C.green:C.red}">${trend>0?'↑':'↓'}${Math.abs(trend)}lbs</span>`:''}</div></div>`;}).join('')}</div>`;}
function showModal(jsonStr){const ex=JSON.parse(jsonStr);const hist=(STATE.history[ex.wk+'|'+ex.name]||[]).slice(-8).reverse();const ytUrl='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.video);document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><div style="font-size:8.5px;letter-spacing:2px;color:${C.accentDim};margin-bottom:3px">EXERCISE DETAIL</div><div style="font-size:16px;font-weight:bold;color:${C.accent}">${ex.name}</div></div><button onclick="closeModal()" style="background:#1a1a26;border:1px solid #252535;color:${C.med};border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:14px">✕</button></div><div style="margin-bottom:10px">${pill(ex.sets+' x '+ex.reps,ex.col||C.accent)}${pill(ex.muscle,C.blue)}${pill('Spine Safe',C.green)}</div><div class="card" style="background:#1a1a26;margin-bottom:10px"><div class="lbl">How To Perform</div><div style="font-size:12px;color:${C.text};line-height:1.75">${ex.description}</div></div><a href="${ytUrl}" target="_blank" style="display:flex;align-items:center;gap:9px;background:#FF000018;border:1px solid #FF000044;border-radius:9px;padding:11px 13px;margin-bottom:12px;text-decoration:none"><span style="font-size:20px">▶️</span><div><div style="font-size:12px;font-weight:bold;color:#FF5555">Watch Form Video on YouTube</div><div style="font-size:9.5px;color:${C.dim}">Search: "${ex.video}"</div></div></a>${hist.length?`<div class="card"><div class="lbl">History</div>${hist.map((h,i,a)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;${i<a.length-1?'border-bottom:1px solid #252535':''}"><div style="font-size:10.5px;color:${C.med}">${h.date} · Set ${h.set+1}</div><div style="font-size:10.5px;color:${C.text};font-weight:bold">${h.w}lbs x ${h.r}</div></div>`).join('')}</div>`:''}</div></div>`;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}
function attachSetListeners(){document.querySelectorAll('.log-btn').forEach(btn=>{btn.onclick=function(){const row=this.closest('.set-row');const wk=row.dataset.wk,ex=row.dataset.ex,idx=parseInt(row.dataset.idx),col=row.dataset.col;const inputs=row.querySelectorAll('input');const w=inputs[0].value,r=inputs[1].value;if(!w)return;const hk=wk+'|'+ex;if(!STATE.history[hk])STATE.history[hk]=[];STATE.history[hk].push({w,r,set:idx,date:new Date().toLocaleDateString()});STATE.history[hk]=STATE.history[hk].slice(-60);saveHistory();row.classList.add('done');this.textContent='✓';this.style.background=C.green+'22';this.style.color=C.green;this.style.borderColor=C.green+'55';flash('Logged');};});}
setInterval(()=>{STATE.tipIndex=(STATE.tipIndex+1)%TIPS.length;if(STATE.tab==='home'){const el=document.getElementById('tip-text');if(el)el.textContent=TIPS[STATE.tipIndex];}},7000);
render();
</script>
</body>
</html>
